<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/base}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/travel_detail.css}" />
    <!-- GLightbox 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

    <title>여행 상세</title>
    <script defer th:src="@{/js/travel_detail.js}"></script>
</head>
<body>
<div class="bg-gradient-custom min-vh-100" layout:fragment="content">
    <div class="container py-4">

        <!-- 여행 정보 없음 -->
        <div th:if="${travel == null}" class="text-center py-5">
            <h2>해당 여행 정보를 찾을 수 없습니다.</h2>
            <a th:href="@{/schedule/list}" class="btn btn-primary mt-3">목록으로 돌아가기</a>
        </div>

        <!-- 여행 정보 있음 -->
        <div th:if="${travel != null}">
            <div class="row mb-4">
                <div class="col-12 text-center">
                    <h1 class="mb-2" th:text="${travel.title}"></h1>
                    <p class="text-muted">
                        <i class="bi bi-geo-alt-fill me-1"></i>
                        <span th:text="${travel.locationKorean}"></span>
                    </p>
                </div>
            </div>

            <!-- ✅ 같은 row 안에 왼쪽(col-lg-9)과 오른쪽(col-lg-3)을 배치 -->
            <div class="row">

                <!-- ⬅️ 왼쪽: 여행 정보 + (아래) 여행 후기 -->
                <div class="col-lg-9">

                    <!-- 여행 정보 카드 -->
                    <div class="card shadow-sm rounded-4 mb-4">
                        <div class="card-body p-4">

                            <div class="d-flex justify-content-between">
                                <h4 class="card-title fw-bold mb-3">여행 정보</h4>
                                <div th:if="${isOwner}">
                                    <a th:href="@{'/schedule/edit?id=' + ${travel.id}}" id="editBtn"
                                       class="btn btn-sm btn-outline-secondary"
                                       th:data-id="${travel.id}" th:data-status="${travel.status}">수정</a>
                                    <button id="deadlineBtn" class="btn btn-sm btn-outline-danger"
                                            th:data-id="${travel.id}" th:data-status="${travel.status}">마감</button>
                                    <button id="canceledBtn" class="btn btn-sm btn-outline-warning"
                                            th:data-id="${travel.id}" th:data-status="${travel.status}">취소</button>
                                </div>
                            </div>

                            <p class="card-text text-muted" th:text="${travel.content}"></p>
                            <hr />

                            <!-- 여행 세부 정보 -->
                            <div class="row text-center mb-3">

                                <div class="col mb-2">
                  <span class="badge bg-warning-subtle text-dark">
                    <i class="bi bi-alarm me-1"></i> <strong>모집마감</strong>
                  </span>
                                    <p class="mb-0 mt-1"
                                       th:text="${#temporals.format(travel.recruitEndDate, 'yyyy. MM. dd')}"></p>
                                </div>

                                <div class="col mb-2">
                  <span class="badge bg-secondary-subtle text-dark">
                    <i class="bi bi-calendar me-1"></i> <strong>일정</strong>
                  </span>
                                    <p class="mb-0 mt-1"
                                       th:text="${#temporals.format(travel.startDate, 'yyyy. MM. dd')} + ' ~ ' + ${#temporals.format(travel.EndDate, 'yyyy. MM. dd')}"></p>
                                </div>

                                <div class="col mb-2">
                  <span class="badge bg-secondary-subtle text-dark">
                    <i class="bi bi-currency-yen me-1"></i> <strong>예상 비용</strong>
                  </span>
                                    <p class="mb-0 mt-1"
                                       th:text="${#numbers.formatInteger(travel.estimatedCost, 3, 'COMMA')} + '엔'"></p>
                                </div>

                                <div class="col mb-2">
                  <span class="badge bg-secondary-subtle text-dark">
                    <i class="bi bi-person-circle me-1"></i> <strong>선호 연령</strong>
                  </span>
                                    <p class="mb-0 mt-1" th:text="${travel.ageLimitKorean}"></p>
                                </div>

                                <div class="col mb-2">
                  <span class="badge bg-secondary-subtle text-dark">
                    <i class="bi bi-gender-ambiguous me-1"></i> <strong>성별 제한</strong>
                  </span>
                                    <p class="mb-0 mt-1"
                                       th:text="${travel.genderLimit == 'N' ? '제한 없음' : (travel.genderLimit == 'M' ? '남성만' : '여성만')}"></p>
                                </div>

                                <div class="col mb-2">
                  <span class="badge bg-secondary-subtle text-dark">
                    <i class="bi bi-people me-1"></i> <strong>인원</strong>
                  </span>
                                    <p class="mb-0 mt-1"
                                       th:text="${travel.currentParticipants} + '/' + ${travel.maxParticipants} + '명'"></p>
                                </div>

                                <div class="col mb-2">
                  <span class="badge bg-success-subtle text-dark">
                    <i class="bi bi-person-plus me-1"></i> <strong>상태</strong>
                  </span>
                                    <p class="mb-0 mt-1" th:switch="${travel.status}">
                                        <span th:case="'OPEN'">모집 중</span>
                                        <span th:case="'MATCHED'">모집 완료</span>
                                        <span th:case="'CLOSED'">여행 종료</span>
                                        <span th:case="'CANCELED'">취소됨</span>
                                        <span th:case="*">모집 중</span>
                                    </p>
                                </div>
                            </div>

                            <!-- 태그 -->
                            <div class="col-12 d-flex gap-2 mb-3"
                                 id="travelTags"
                                 th:attr="data-tags=${#strings.listJoin(travel.tags, ',')}"
                                 style="min-height: 20px;">
                                <span th:if="${#lists.isEmpty(travel.tags)}" class="text-muted">등록된 태그가 없습니다.</span>
                            </div>

                            <!-- 이미지 -->
                            <div class="d-flex flex-nowrap overflow-auto g-2 image-gallery justify-content-center"
                                 th:if="${images != null and !#lists.isEmpty(images)}">
                                <div class="image-item p-1" th:each="image : ${images}">
                                    <img th:src="${image.imagePath}"
                                         class="rounded-3 travel-image"
                                         alt="여행 이미지"
                                         style="width: 220px; height: 160px; object-fit: cover; cursor: pointer;">
                                </div>
                            </div>

                            <!-- 🖼️ 이미지 확대 모달 -->
                            <div id="imageModal" class="image-modal" onclick="closeImageModal()">
                                <img id="modalImage" class="modal-content">
                            </div>

                        </div>
                    </div>

                    <!-- ✅ 여행 후기 카드 (왼쪽 열 내부로 이동) -->
                    <div class="card shadow-sm rounded-4 mb-4">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h4 class="card-title fw-hold mb-0">여행 후기</h4>
                                <div>
                                    <!-- 후기 작성 버튼 조건부 노출 자리 -->
                                </div>
                            </div>

                            <!-- 리뷰 없음 -->
                            <div th:if="${#lists.isEmpty(reviews)}" class="text-center text-muted py-4">
                                <i class="bi bi-chat-dots fs-3 d-block mb-2"></i>
                                <p class="mb-0">아직 등록된 후기가 없습니다.</p>
                            </div>

                            <!-- 리뷰 목록 -->
                            <div th:if="${!#lists.isEmpty(reviews)}">
                                <div th:each="review : ${reviews}" class="review-item border-bottom pb-3 mb-3">
                                    <div class="d-flex align-items-center mb-2">
                                        <img th:src="${review.reviewerImagePath != null ? review.reviewerImagePath : '/image/tomori.jpg'}"
                                             class="rounded-circle me-2" style="width:45px; height:45px; object-fit:cover;">
                                        <div style="display: flex; justify-content: space-between; align-items: center; width: 90%;">
                                            <!-- 왼쪽: 닉네임 + 별점 -->
                                            <div style="display: flex; align-items: center; gap: 15px;">
                                                <strong th:text="${review.nickname}">닉네임</strong>
                                                <div class="star-rating">
                                                    <i class="bi"
                                                       th:each="i : ${#numbers.sequence(1, 5)}"
                                                       th:classappend="${i <= review.rating} ? 'bi-star-fill text-warning' : 'bi-star text-secondary'"></i>
                                                </div>
                                            </div>

                                            <!-- 오른쪽: 날짜 -->
                                            <small class="text-muted"
                                                   th:text="${#temporals.format(review.createdAt, 'yyyy년 MM월 dd일')}"></small>
                                        </div>


                                    </div>
                                    <div class="ps-1">
                                        <p class="mb-1 fw-semibold" th:text="${review.title}">리뷰 제목</p>
                                        <p class="text-muted mb-2" th:text="${review.content}">리뷰 내용</p>
                                        <!-- 리뷰 이미지 -->
                                        <div class="d-flex flex-wrap gap-2" th:if="${review.images != null}">
                                            <a th:each="img : ${review.images}"
                                               th:href="${img.imagePath}"
                                               class="glightbox"
                                               data-gallery="review-gallery"
                                               th:data-title="${review.title}">
                                                <img th:src="${img.imagePath}"
                                                     class="rounded-3 border"
                                                     style="width:100px; height:100px; object-fit:cover; cursor:pointer;">
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <!-- /여행 후기 카드 -->

                </div>
                <!-- /왼쪽 -->

                <!-- ➡️ 오른쪽: 참여자 카드 (같은 row 안에 유지) -->
                <div class="col-lg-3">
                    <form id="joinForm" th:action="@{/join-request}" method="post">
                        <input type="hidden" name="tripArticleId" th:value="${travel.id}">
                        <input type="hidden" name="hostUserId" th:value="${travel.hostUserId}">
                        <input type="hidden" name="chatRoomId" th:value="${chatRoomId}">
                        <div class="card shadow-sm rounded-4 p-4 sticky-top" style="top: 20px">
                            <div class="text-center mb-3">
                                <img th:src="${author != null && author.imagePath != null ? author.imagePath : '/image/testuser.jpg'}"
                                     alt="프로필 이미지" class="rounded-circle mb-2"
                                     style="width: 80px; height: 80px; object-fit: cover" />
                                <h5 class="mb-0">여행 작성자</h5>
                                <small class="text-muted" th:text="${author != null && author.nickname != null ? '' + author.nickname : ''}"></small>
                            </div>
                            <div class="d-grid mb-3">
                                <button id="joinBtn" type="button" class="btn btn-wakutabi-primary btn-lg">참가 신청하기</button>
                            </div>
                            <p class="text-muted text-center small">여행 참가 신청 시, 작성자에게 알림이 전송됩니다.</p>
                            <hr />
                            <h6 class="fw-bold mb-3">참여자 목록</h6>
                            <ul class="list-unstyled">
                                <li class="d-flex align-items-center mb-2" th:each="participant : ${participants}">
                                    <a th:href="@{'/profile/my?userId='+${participant.userId}}"
                                       class="participant-link ms-2 d-flex align-items-center">
                                    <img th:src="${participant.imagePath != null ? participant.imagePath : '/image/testuser.jpg'}"
                                         style="width:55px; height:55px;" alt="참여자" class="participant-avatar" />
                                        <span th:text="${participant.nickname}">참여자</span>
                                    </a>
                                </li>
                                <li th:if="${#lists.isEmpty(participants)}" class="text-muted text-center">참여자가 없습니다.</li>
                            </ul>
                        </div>
                    </form>
                </div>
                <!-- /오른쪽 -->

            </div> <!-- /row -->
        </div> <!-- /travel != null -->
    </div> <!-- /container -->

    <script th:inline="javascript" th:if="${errorMessage != null}">
        alert([[${errorMessage}]]);
    </script>
</div>
</body>
</html>
