<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layouts/base}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/myTrips.css}"/>
    <title>내 여행 관리</title>
    <th:block layout:fragment="head">
        <script defer th:src="@{/js/travel.js}"></script>
    </th:block>
</head>

<body>
    <div class="bg-gradient-custom min-vh-100" layout:fragment="content">
        <div class="container py-4">
            <!-- Page Header -->
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="text-center mb-2">내 여행 관리</h1>
                </div>
            </div>
            <!-- Filter & Results -->
            <div class="row">
                <!-- Results Section -->
                <div class="col-lg-9">
                    <!-- Schedule Cards -->
                    <div class="row g-4">
                        <!-- Schedule Card 1 -->
                        <h3>등록한 여행</h3>
                        <section id="my-registered-trips" class="mb-5">
                            <div th:if="${#lists.isEmpty(registeredTrips)}" class="alert alert-info" role="alert">
                                아직 등록한 여행 일정이 없습니다.
                            </div>
                            <div th:each="trip : ${registeredTrips}" th:if="${trip != null}" class="mb-4">
                                <div class="col-12">
                                    <div class="card schedule-card border-0 shadow-sm">
                                        <div class="row g-0">
                                            <div class="col-md-4">
                                                <img th:src="${trip.mainImagePath} ?: '/image/default_trip.jpg'"
                                                    class="img-fluid rounded-start object-fit-cover" th:alt="${trip.title}"
                                                />
                                            </div>
                                            <div class="col-md-8">
                                                <div class="card-body">
                                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                                        <h5 class="card-title mb-0" th:text="${trip.title}"></h5>
                                                        <span class="badge region-badge" th:text="${trip.locationKorean}"></span>
                                                    </div>
                                                    <div class="date-range mb-2">
                                                        <i class="bi bi-calendar-event me-1"></i>
                                                        <span th:text="${#temporals.format(trip.startDate, 'yyyy년 MM월 dd일')}"></span>
                                                        ~
                                                        <span th:text="${#temporals.format(trip.endDate, 'yyyy년 MM월 dd일')}"></span>
                                                    </div>
                                                    <div class="date-range mb-2">
                                                        <i class="bi bi-calendar-check me-1"></i>
                                                        <span>모집 마감: </span>
                                                        <span th:text="${#temporals.format(trip.recruitEndDate, 'yyyy년 MM월 dd일')}"></span>
                                                    </div>
                                                    <p class="card-text text-muted mb-3"
                                                        th:text="${#strings.abbreviate(trip.content, 100)}">
                                                    </p>
                                                    <div class="mb-3">
                                                        <span th:each="tag : ${trip.tags}" class="badge schedule-tag me-1" th:text="${tag}"></span>
                                                    </div>
                                                    <div class="row align-items-center">
                                                        <div class="col-md-6">
                                                            <div class="participants-info p-2 rounded">
                                                                <div class="status-info js-participants-toggle">
                                                                    <i class="bi bi-people-fill me-1"></i>
                                                                    <strong th:text="${trip.currentParticipants} + '/' + ${trip.maxParticipants} + '명'"></strong>
                                                                    참여 중
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6 text-md-end">
                                                            <div class="d-flex gap-2 justify-content-md-end">
                                                                <a th:href="@{'/schedule/detail?id=' + ${trip.id}}"
                                                                    class="btn btn-wakutabi-outline btn-sm">
                                                                    상세보기
                                                                </a>
                                                                <a th:href="@{'/schedule/edit?id=' + ${trip.id}}"
                                                                    th:data-id="${trip.id}" th:data-status="${trip.status}"
                                                                    class="btn btn-wakutabi-primary btn-sm editBtn">
                                                                    수정
                                                                </a>
                                                                <button class="btn btn-wakutabi-primary btn-sm btn-manage" th:data-trip-id="${trip.id}"
                                                                    data-bs-toggle="collapse" th:data-bs-target="|#applicant-${trip.id}|">
                                                                    신청 관리
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div th:if="${trip.id != null}" th:id="|${'applicant-' + trip.id}|" class="applicants-container collapse mt-2"></div>
                                </div>
                            </div>
                        </section>
                        <button id="loadMoreRegistered" class="btn btn-outline-secondary py-2 mt-3">
                            <i class="bi bi-arrow-down-circle me-2"></i> 여행 더보기
                        </button>
                        <!--Schedule Card 2  -->
                        <h3>신청한 여행</h3>
                        <section id="my-applied-trips" class="mb-5">
                            <div th:if="${#lists.isEmpty(appliedTrips)}" class="alert alert-info" role="alert">
                                아직 신청한 여행 일정이 없습니다.
                            </div>
                            <div id="applied-trips-list" th:each="trip : ${appliedTrips}" th:if="${trip != null}" class="mb-4">
                                <div class="col-12">
                                    <div class="card schedule-card border-0 shadow-sm">
                                        <div class="row g-0">
                                            <div class="col-md-4">
                                                <img
                                                    th:src="${trip.mainImagePath} ?: '/image/default_trip.jpg'"
                                                    class="img-fluid rounded-start object-fit-cover" th:alt="${trip.title}"
                                                />
                                            </div>
                                            <div class="col-md-8">
                                                <div class="card-body">
                                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                                        <h5 class="card-title mb-0" th:text="${trip.title}"></h5>
                                                        <span class="badge region-badge" th:text="${trip.locationKorean}"></span>
                                                    </div>
                                                    <div class="date-range mb-2">
                                                        <i class="bi bi-calendar-event me-1"></i>
                                                        <span th:text="${#temporals.format(trip.startDate, 'yyyy년 MM월 dd일')}"></span>
                                                        ~
                                                        <span th:text="${#temporals.format(trip.endDate, 'yyyy년 MM월 dd일')}"></span>
                                                    </div>
                                                    <div class="date-range mb-2">
                                                        <i class="bi bi-calendar-check me-1"></i>
                                                        <span>모집 마감: </span>
                                                        <span th:text="${#temporals.format(trip.recruitEndDate, 'yyyy년 MM월 dd일')}"></span>
                                                    </div>
                                                    <p class="card-text text-muted mb-3"
                                                        th:text="${#strings.abbreviate(trip.content, 100)}">
                                                    </p>
                                                    <div class="mb-3">
                                                        <span th:each="tag : ${trip.tags}" class="badge schedule-tag me-1" th:text="${tag}"></span>
                                                    </div>
                                                    <div class="row align-items-center">
                                                        <div class="col-md-6">
                                                            <div class="participants-info p-2 rounded">
                                                                <div class="status-info js-participants-toggle">
                                                                    <i class="bi bi-people-fill me-1"></i>
                                                                    <strong th:text="${trip.currentParticipants} + '/' + ${trip.maxParticipants} + '명'"></strong>
                                                                    참여 중
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6 text-md-end">
                                                            <div class="d-flex gap-2 justify-content-md-end">
                                                                <a th:href="@{'/schedule/detail?id=' + ${trip.id}}"
                                                                    class="btn btn-wakutabi-outline btn-sm">
                                                                    상세보기
                                                                </a>
                                                                <button class="btn btn-wakutabi-warning btn-sm cancel-application-btn" th:data-trip-id="${trip.id}">
                                                                    신청 취소
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                        <button id="loadMoreApplied" class="btn btn-outline-secondary py-2 mt-3">
                            <i class="bi bi-arrow-down-circle me-2"></i> 여행 더보기
                        </button>
                    </div>
                </div>
                <!-- Sidebar Filters -->
                <div class="col-lg-3 mb-4">
                    <!--  Search Input -->
                    <div class="filter-section p-3 shadow-sm sticky-top">
                        <div class="row mb-3">
                            <div class="col-12">
                                <form id="searchForm" action="/schedule/myTrips" method="get">
                                    <div class="input-group pb-3">
                                        <span class="input-group-text bg-white border-end-0">
                                            <i class="bi bi-search text-primary"></i>
                                        </span>
                                        <input type="text" class="form-control border-start-0 ps-0" placeholder="여행지 검색"
                                            id="searchInput" name="keyward" th:value="${query}"/>
                                        <button class="btn btn-wakutabi-primary px-4" type="submit">
                                            <i class="bi bi-search me-2"></i>검색
                                        </button>
                                    </div>
                                    <div class="filter-section p-3 shadow mb-4">
                                        <h5 class="mb-3">바로 가기</h5>
                                        <div class="d-grid gap-2">
                                            <a href="#my-registered-trips" class="btn btn-wakutabi-primary">
                                                <i class="bi bi-airplane-fill me-2"></i> 등록한 여행
                                            </a>
                                            <a href="#my-applied-trips" class="btn btn-outline-secondary">
                                                <i class="bi bi-file-earmark-check me-2"></i> 신청한 여행
                                            </a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
