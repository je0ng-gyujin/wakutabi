<!DOCTYPE html>
<html
	lang="ko"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/clean}">
<head>
<th:block layout:fragment="head">
    <meta charset="UTF-8">
    <title>아이디 찾기 결과</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/find-id-result.css}">
</th:block>
</head>
<body class="bg-gradient-custom min-vh-100">
<th:block layout:fragment="content">
    <div class="result-container">
        
        <h4>아이디 찾기 결과</h4>

        <div th:if="${foundUsername}" class="result-success">
            <p>찾으시는 아이디는 <strong th:text="${foundUsername}"></strong> 입니다.</p>
        </div>
    
        <div th:if="${errorMessage}" class="result-error">
            <p th:text="${errorMessage}"></p>
        </div>

        <div class="result-actions">
            
            <a th:if="${foundUsername}" th:href="@{/login}" class="btn-primary">로그인하기</a>
            
            <a th:if="${errorMessage}" th:href="@{/user/find-id}" class="btn-secondary">아이디 다시 찾기</a>
        </div>

    </div>
    </th:block>
</body>
</html>
