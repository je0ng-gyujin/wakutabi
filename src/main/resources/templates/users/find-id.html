<!DOCTYPE html>
<html
	lang="ko"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/clean}">
<head>
<th:block layout:fragment="head">
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/find-id.css}">
    
    <script defer th:src="@{/js/findId.js}"></script>
    </th:block>
</head>
<body class="bg-gradient-custom min-vh-100">
<th:block layout:fragment="content">
    <div class="find-id-container">
        <a class="navbar-brand logo-text text-decoration-none" href="/">
	      <img src="/image/icon.png"alt="Wakutabi" height="50" class="me-2">
	    </a>
        <h4>아이디 찾기</h4>
    
        <form th:action="@{/user/find-id/verify}" method="post" onsubmit="return validateForm()">
            
            <div class="form-group">
                <label for="email">가입한 이메일</label>
                <div class="input-group">
                    <input type="email" id="email" name="email" required>
                    <button type="button" id="sendCodeButton" th:data-url="@{/user/find-id/send-code}">인증번호 받기</button>
                </div>
                <p id="emailMessage"></p> </div>
    
            <div id="verificationCodeGroup" class="form-group" style="display: none;">
                <label for="code">인증번호</label>
                <input type="text" id="code" name="code" placeholder="6자리 숫자를 입력하세요" required>
                <p id="timer"></p>
            </div>
    
            <button type="submit" id="submitButton" disabled>아이디 찾기</button>
        </form>
    
        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}"></p>
        </div>

    </div> 
    </th:block>
    </body>
</html>
