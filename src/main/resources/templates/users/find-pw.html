<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    
    <link rel="stylesheet" th:href="@{/css/find-pw.css}">
    <script defer th:src="@{/js/findPw.js}"></script>
    </head>
<body>

    <div class="find-pw-container">
        
        <h2>비밀번호 찾기</h2>
    
        <form th:action="@{/user/find-pw/reset}" method="post" onsubmit="return validatePasswordForm()">
            
            <div class="form-group">
                <label for="email">가입한 이메일</label>
                <div class="input-group">
                    <input type="email" id="email" name="email" required>
                    <button type="button" id="sendCodeButton" th:data-url="@{/user/find-pw/send-code}">인증번호 받기</button>
                </div>
                <p id="emailMessage"></p>
            </div>
    
            <div id="verificationCodeGroup" class="form-group" style="display: none;">
                <label for="code">인증번호</label>
                <input type="text" id="code" name="code" placeholder="6자리 숫자를 입력하세요" required>
                <p id="timer"></p>
            </div>

            <div id="passwordGroup" class="form-group" style="display: none;">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="새 비밀번호를 입력하세요" required>
                
                <label for="confirmNewPassword">새 비밀번호 확인</label>
                <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="새 비밀번호를 다시 입력하세요" required>
                
                <p id="passwordMessage"></p> </div>
    
            <button type="submit" id="submitButton" disabled>비밀번호 변경</button>
        </form>
    
        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}"></p>
        </div>

    </div>
</body>
</html>
